0, "51": 10, "52": 10, "53": 10, "54": 10}}, {"k": "task", "l": "Оформление и передача исполнительной документации", "n": "8", "cells": {"46": 1, "47": 1, "48": 1, "49": 1, "50": 1, "51": 1, "52": 1, "53": 1, "54": 1}, "c": "org", "w": ["2027-01-18", "2027-01-31"], "f": ["A7"], "o": {"46": 2, "47": 2, "48": 2, "49": 2, "50": 2, "51": 2, "52": 2, "53": 2, "54": 2}}]}], "fl": 2}], "rem": [{"h": "A. Соответствие Приложению № 2 к договору", "items": [{"c": "A1", "s": "l", "t": "1 этаж: график получен 25.11.2026, замечание снято", "p": "В первой версии сверки графика 1 этажа не было. 25.11.2026 Неолит передал «ГПР Тверская 1 Этаж» — отделка помещений 1 этажа (спортзалы и гардеробные), 48 видов работ, 21.10.2026–14.01.2027, пик 121 человек 29–30.11. Замечания к нему — в разделе D.", "fix": "Не требуется. Исправленный график по 1 этажу — в разделе D и в рабочем графике (кнопка «Исправления графика»).", "tb": null}, {"c": "A2", "s": "c", "t": "Нет пусконаладочных работ", "p": "Договор: ПНР 07.12.2026–28.02.2027, индивидуальные ПНР систем до 01.02.2027, комплексное опробование и передача 01.02–28.02.2027. В новом графике ПНР нет совсем, последняя строка — передача ИД до 31.01.2027.", "fix": "Добавлены индивидуальные ПНР систем 18.01–31.01 и комплексное опробование 01.02–28.02 — в договорном окне ПНР.", "tb": null}, {"c": "A3", "s": "c", "t": "Нет слаботочных систем, ВК, противодымной вентиляции", "p": "Договорное окно «Инженерные системы» включает механику, электрику и слаботочные системы. В графике только ЭОМ и ОВиК. Нет СПС/СОУЭ, СКС, СКУД, СОТ, СОТС, САВО, АСДУ (номинированные подрядчики), нет ХВС/ГВС и канализации (ст. 2.6, 2.7), противодымной вентиляции (ст. 2.4), ВПВ. Без фронтов слаботочки нельзя планировать зашивку потолков с 23.11 и закрытие фальшпола с 19.12.", "fix": "Добавлены слаботочные системы (фронт номинированных подрядчиков) до зашивки потолков и в полости фальшпола, а также ПДВ, ВК и ВПВ до зашивки. Сроки номинированных подрядчиков нужно подтвердить с ними.", "tb": null}, {"c": "A4", "s": "w", "t": "Черновые работы выходят за 20.12.2026", "p": "Договор: 09.11–20.12.2026. В графике: лобики пом. 239 до 25.12 (+5 дней), шпатлёвка стен 262/263 до 29.12 (+9), потолок ГКЛ 239 и фальшпол 233/262/263 до 31.12 (+11), фальшпол 239 до 18–20.01 (+31), шпатлёвка потолка 239 до 22.01 (+33). Начало штукатурки 30.10 раньше договорного 09.11 — в пределах срока зоны.", "fix": "Черновые работы закрываются к 20.12: зашивка потолка 239 — 11–19.12 при 12 чел., лобики — до 05.12 при 10 чел. Фальшпол перенесён после окраски потолков и отнесён к чистовому этапу — согласовать с Заказчиком; иначе срок 20.12 для фальшпола невыполним.", "tb": null}, {"c": "A5", "s": "w", "t": "Чистовые работы выходят за 24.01.2027", "p": "Договор: 07.12.2026–24.01.2027. Окраска потолка и ковролин/ПВХ в пом. 239 идут до 28.01 (+4 дня).", "fix": "Чистовые работы заканчиваются 23.01: ковролин 239 — 18–22.01.", "tb": null}, {"c": "A6", "s": "w", "t": "Инженерные системы: поздний старт и хвост после 27.01", "p": "Договор: 26.10.2026–27.01.2027. В графике ЭОМ и ОВиК начинаются 19–21.11, то есть первые 3,5 недели окна не использованы. Воздуховоды фанкойлов (п. 7.3) по полосам идут до 28–29.01 (+1–2 дня).", "fix": "Инженерные трассы уплотнены 21.11–09.12 и закончены до зашивки; оконечные устройства — до 23.01, в пределах окна до 27.01.", "tb": null}, {"c": "A7", "s": "w", "t": "Приёмка зоны сжата до 2–3 дней", "p": "Договор: предъявление и устранение замечаний 18.01–31.01.2027. В графике основные работы в пом. 239 идут до 28.01, «устранение замечаний» (10 чел.) с 16.01 идёт параллельно с ними. Реальное предъявление возможно не раньше 29.01.", "fix": "Основные работы закончены 23.01. Предъявление помещений 233, 262, 263 — с 18.01, помещения 239 — с 24.01; на приёмку остаётся две недели.", "tb": null}, {"c": "A8", "s": "w", "t": "Нет части работ из сметы по актовому залу", "p": "Не показаны: двери, стеновые панели СМЛ Bonacoustic и реечные Wallhof, трансформируемая система, сантехническое оборудование, мебель. Потолки АП-10 упомянуты в п. 6.7 («после установки потолков АП-10»), но строки на их монтаж нет.", "fix": "Не устраняется: двери, панели, трансформируемая система, сантехника, мебель, потолки АП-10 зависят от поставки давальческих и номинированных материалов. Добавить после получения графиков поставки.", "tb": null}, {"c": "A9", "s": "l", "t": "Шапка и подписи", "p": "В графике «Утверждено со стороны Заказчика: Директор департамента — Главный архитектор проектов». По договору Заказчик — АО «МЛ-Инвест», подписант — генеральный директор. В заголовке «отделка помещений 2-го этажа и раздел ЭОМ», хотя в графике есть и ОВиК. Нумерация: два раздела № 6.", "fix": "Формальное: исправить подписанта и заголовок при переоформлении графика.", "tb": null}]}, {"h": "B. Ошибки в датах самого графика", "items": [{"c": "B1", "s": "w", "t": "В 15 строках текстовые даты не совпадают с полосами", "p": "Визуализация построена по полосам. Даты в столбцах «Начало/Окончание» нужно исправить, иначе график нельзя подписывать.", "fix": "В исправленном листе даты начала и окончания считаются по полосам, расхождений текста и графики нет.", "tb": [["2.9", "233: подсистема фальшпола", "13.11–31.12.2026", "11.12–31.12"], ["3.8", "239: грунтовка потолка", "16.01.2026–24.01.2027", "16.01–24.01.2027 (год)"], ["3.12", "239: ковролин / ПВХ", "18.01.2027–28.01.2026", "16.01–28.01.2027 (год)"], ["4.5, 5.5", "262, 263: окраска стен", "14.12.2026–20.01.2027", "14.01–20.01.2027"], ["4.10, 5.10", "262, 263: ковролин / ПВХ", "18.01.2027–24.01.2026", "16.01–24.01.2027 (год)"], ["6.2", "ЭОМ: трассировка в гофре по потолку", "19.12–30.12.2026", "21.11–31.12"], ["7.1", "Воздуховоды и фасонные изделия", "25.12–12.12.2026 (конец раньше начала)", "25.11–13.12"], ["7.2", "Радиаторы, конвекторы", "19.21.2026 (нет такой даты)–18.01.2027", "19–25.11 и 16–18.01"], ["7.3", "Воздуховоды фанкойлов, пленумы", "13.12–19.12.2026", "13–19.12 и 20–28.01"], ["7.4", "АУПТ", "25.11.2026–16.01.2027", "25.11–13.12 и 04–10.01"], ["7.6", "Фанкойлы, обвязка", "09.12–29.12.2026", "09–23.12 и 20–26.01"], ["7.7", "Дренаж конденсата", "09.12.2026–27.01.2026", "29.11–13.12"], ["7.8", "Восстановление воздуховодов", "04.12–15.12.2026", "29.11–13.12"]]}]}, {"h": "C. Технологическая последовательность", "items": [{"c": "C1", "s": "c", "t": "Пом. 239: фальшпол одновременно с потолком", "p": "Подсистема фальшпола 11.12–18.01 и панели 19.12–20.01 идут в то же время, что зашивка потолка ГКЛ (до 31.12), его шпатлёвка (08–22.01) и окраска (18–28.01). Леса и вышки для потолка стоят на перекрытии, по стойкам и панелям фальшпола работать с них нельзя. Фальшпол — после окончания потолочных работ либо жёсткое деление зала на захватки с защитой пола.", "fix": "Фальшпол в 239 начинается 08.01 по захваткам вслед за окраской потолка (до 10.01); панели — с 14.01.", "tb": null}, {"c": "C2", "s": "c", "t": "Пом. 239: ковролин кладут под окраску потолка", "p": "Ковролин/ПВХ 16–28.01 совпадает с грунтовкой (16–24.01) и окраской потолка (18–28.01). Чистовое покрытие пола укладывается после окраски потолка и стен.", "fix": "Ковролин 239 — 18–22.01, после окраски потолка (до 10.01) и стен (до 14.01).", "tb": null}, {"c": "C3", "s": "w", "t": "Пом. 233 и 239: стены красят раньше потолка", "p": "233: окраска стен 23–31.12, а потолок шпатлюют 21–29.12 и красят 10–14.01. 239: окраска стен 25–31.12, потолок шпатлюют 08–22.01 и красят 18–28.01. Пыль от шлифовки и брызги попадут на готовые стены. Порядок «сверху вниз» соблюдён только в 262/263 (потолок 23–31.12, стены 14–20.01).", "fix": "Во всех помещениях порядок «потолок, затем стены»: 233 — потолок до 25.12, стены 27–31.12; 239 — потолок до 10.01, стены 10–14.01.", "tb": null}, {"c": "C4", "s": "c", "t": "Инженерные работы в запотолочном пространстве после зашивки", "p": "Потолок 233 зашит к 19.12, потолок 239 — к 31.12. При этом трассировка ЭОМ в гофре по потолку (п. 6.2) по тексту идёт 19–30.12, фанкойлы и обвязка (п. 7.6) — до 23.12 и снова 20–26.01, воздуховоды фанкойлов и пленумы (п. 7.3) — 20–28.01, когда потолок уже шпатлюют и красят. Подрядчик должен показать, где эти работы ведутся, либо перенести их до зашивки.", "fix": "Все работы в запотолочном пространстве (ЭОМ, фанкойлы, воздуховоды, АУПТ, слаботочка) завершаются 09.12, зашивка — с 11.12.", "tb": null}, {"c": "C5", "s": "w", "t": "Нет испытаний и освидетельствования скрытых работ", "p": "До зашивки потолков и закрытия фальшпола нет гидравлических испытаний АУПТ, обвязки фанкойлов и отопления, пролива дренажа, замеров изоляции кабеля, актов скрытых работ. Дренаж (п. 7.7) заканчивают 13.12, а фанкойлы монтируют до 23.12 — подключение и пролив дренажа после этого не предусмотрены.", "fix": "Добавлены 09–11.12: гидравлические испытания, пролив дренажа, замеры изоляции, акты скрытых работ. Дренаж идёт после фанкойлов.", "tb": null}, {"c": "C6", "s": "w", "t": "Нет запаса между инженерными трассами и зашивкой потолка", "p": "Каркас и зашивка ГКЛ стартуют 23.11 в 233 и 239. Лотки и кабель освещения «до зашивки» начинаются 21.11 и идут до 17.12, АУПТ и воздуховоды — только с 25.11 до 13.12. Зашивка обгонит трассы, если не разбить помещения на захватки с передачей фронта по акту.", "fix": "Каркас потолка ведётся параллельно с трассами, зашивка — только после актов скрытых работ.", "tb": null}, {"c": "C7", "s": "w", "t": "Оконечные устройства ставят до окончания окраски", "p": "Светильники 12–26.01 и решётки/диффузоры 29–31.12 и 16–18.01 — при окраске потолка 239 до 28.01. Розетки, выключатели и люки с 08.01 — при окраске стен 262/263 14–20.01. Радиаторы 16–18.01 — в те же дни. Оконечные устройства монтируются после финишной окраски.", "fix": "Светильники, решётки, оросители, розетки и радиаторы ставятся после окраски: 27–31.12 в малых помещениях, 12–22.01 в 239.", "tb": null}, {"c": "C8", "s": "w", "t": "Нет технологических перерывов на сушку", "p": "233: базовая шпатлёвка с 06.11, на следующий день после штукатурки 20 мм по сетке (до 05.11). 239: лобики с металлоконструкциями закончены 25.12, окраска стен начинается 25.12, а финишная шпатлёвка завершена ещё 11.12 — на отделку самого лобика времени нет.", "fix": "Отделка лобика выделена отдельной строкой 07–13.12. Для штукатурки 233 период уже прошёл — проверить влажность основания перед окраской.", "tb": null}, {"c": "C9", "s": "w", "t": "Пом. 239: лобики идут одновременно с потолком", "p": "Подпорная стена (лобики) с металлоконструкциями 23.11–25.12 стартует в один день с каркасом потолка. Потолок примыкает к лобику, поэтому лобик должен опережать. Сварка рядом с финишной шпатлёвкой и грунтовкой стен (до 23.12) требует защиты и наряда-допуска.", "fix": "Лобики 23.11–05.12 (10 чел.) опережают зашивку потолка 239, которая начинается 11.12.", "tb": null}, {"c": "C10", "s": "l", "t": "Работы в новогодние праздники", "p": "На 04–08.01 запланированы АУПТ, фальшпол и шпатлёвка потолка 239 (от 2 до 16 человек). Нужно подтвердить режим работы объекта и допуск в праздничные дни.", "fix": "На 01–07.01 работы не запланированы.", "tb": null}, {"c": "C11", "s": "l", "t": "Пом. 233: потолок без финишной шпатлёвки и грунтовки", "p": "После базовой шпатлёвки швов (21–29.12) сразу окраска 10–14.01. В 239 для того же потолка предусмотрены финишная шпатлёвка и грунтовка.", "fix": "Для потолка 233 добавлены финишная шпатлёвка, шлифовка и грунтовка 15–19.12.", "tb": null}, {"c": "C12", "s": "l", "t": "Кабель в полости фальшпола после закрытия панелей", "p": "Кабель розеточных групп (п. 6.3) идёт 03–07.12, 19–31.12 и 14–16.01. Панели фальшпола в 233/262/263 закрыты к 31.12, в 239 — к 20.01. Хвост 14–16.01 допустим только для 239; для остальных помещений прокладка должна закончиться до панелей.", "fix": "Кабель в полости фальшпола идёт между подсистемой и панелями в каждом помещении.", "tb": null}, {"c": "C13", "s": "l", "t": "Пик 65 человек в четырёх помещениях", "p": "11–14.12 в зоне одновременно 65 человек, с 23.11 по 31.12 стабильно 38–53. При принципе «стены, потолок и пол одновременно» нужны схема захваток и график движения бригад, иначе фронты будут мешать друг другу.", "fix": "Пик численности по исправленному графику — см. итоговую строку 2 этажа на листе «ГПР исправленный». Ресурсы должен подтвердить Неолит; фактическая численность по отчёту это позволяет.", "tb": null}]}, {"h": "D. График 1 этажа (получен 25.11.2026)", "items": [{"c": "D1", "s": "w", "t": "Нет приёмки зоны, устранения замечаний и ПНР", "p": "График заканчивается 14.01.2027, по договору зона 1 этажа сдаётся до 31.01.2027, приёмка зоны 18.01–31.01.2027. Формально срок выдержан с запасом 17 дней, но предъявления зоны Заказчику, устранения замечаний, индивидуальных испытаний систем и ПНР в графике нет. Исполнительная документация (п. 2) — 25.12–12.01, один человек.", "fix": "Добавлены индивидуальные испытания и ПНР систем 14–25.01 и предъявление зоны, устранение замечаний, приёмка 18–31.01.2027.", "fl": "В исправленном графике:", "tb": null}, {"c": "D2", "s": "w", "t": "Нет разбивки по помещениям", "p": "По договору зона 1 этажа — 20 помещений; график назван «спортзалы и гардеробные» и даёт одну строку на вид работ по всей зоне. Фронты и готовность помещений проверить нельзя: неясно, где потолок закрытый, а где открытый, где мокрые процессы, в каком порядке сдаются помещения. График 2 этажа разбит по помещениям.", "fix": "Не устранено: разбивку по помещениям может дать только Неолит. Исправления сделаны на уровне видов работ, по захваткам.", "fl": "В исправленном графике:", "tb": null}, {"c": "D3", "s": "w", "t": "Фальшпол выходит за срок черновых работ", "p": "Договор: черновые общестроительные работы 14.10–13.12.2026. Фальшпол (п. 1.7) по полосам идёт 07.12.2026–14.01.2027, то есть на 32 дня дольше. Остальные черновые работы (перегородки, штукатурка, потолки ГКЛ) в договорное окно укладываются. То же замечание по 2 этажу — A4.", "fix": "Фальшпол поставлен после окраски потолков: 19.12–01.01 и 08–17.01. За срок 13.12 он выходит по-прежнему — нужно согласовать с Заказчиком отнесение к чистовому этапу.", "fl": "В исправленном графике:", "tb": null}, {"c": "D4", "s": "c", "t": "Потолки закрывают раньше, чем закончены сети над ними", "p": "Подвесные потолки ГКЛ (п. 1.9) по полосам 21.11–06.12.2026. После этой даты в запотолочном пространстве ещё идут: ЭОМ сети до 12.01 (основной объём до 23.12), холодоснабжение до 14.12 и 07–14.01, водоснабжение до 14.12, СКС, СКУД, СОТ, СОТС до 12.01, вентиляция 07–14.01. Люди на АПС, АПТ и АСДУ стоят только 05–12.01, когда потолки уже окрашены.", "fix": "Потолки ГКЛ разделены: каркас 21–28.11, зашивка 09–14.12 после актов. Трассы ЭОМ, холодоснабжения, водоснабжения и слаботочных систем над потолком сжаты до 25.11–08.12 с усилением бригад при тех же трудозатратах.", "fl": "В исправленном графике:", "tb": null}, {"c": "D5", "s": "c", "t": "Противопожарные и слаботочные системы без людей", "p": "СОУЭ (п. 1.42): полоса 11.11–12.01, во всех ячейках 0 человек. АПС, АПТ и АСДУ (в файле Неолита строка названа «АДУ+РС+СС+ПУ»): 0 человек до конца декабря, по 2 человека только 05–12.01. СКС, СКУД, СОТ, СОТС: полосы с 11.11, люди с 23.11 (15 человек). В тексте у всех начало 12.11. Монтаж ведёт ООО «ИЦ Телеком-Сервис», по отчёту слаботочники на площадке 20.11 и с 23.11 (19–21 чел.).", "fix": "На СОУЭ, АПС, АПТ и АСДУ поставлены люди: трассы 25.11–08.12, оконечные устройства 12–19.01 после окраски. На 25.11–08.12 нужно до 34 слаботочников против 21 по отчёту — требуется подтверждение ИЦ Телеком-Сервис.", "fl": "В исправленном графике:", "tb": null}, {"c": "D6", "s": "w", "t": "Нет сушки штукатурки перед отделкой", "p": "Оштукатуривание по сетке 20 мм (п. 1.24) идёт до 30.11. Облицовка стен керамогранитом начинается 29.11, окраска стен и декоративная штукатурка — 01.12. Перерыва на набор прочности и сушку нет, шпатлёвка и грунтовка в графике не показаны.", "fix": "Добавлена шпатлёвка и грунтовка 25.11–12.12. Облицовка стен сдвинута на 05.12, окраска стен и декоративная штукатурка — на 13.12.", "fl": "В исправленном графике:", "tb": null}, {"c": "D7", "s": "w", "t": "Перегородки из блоков возводят после начала штукатурки и сетей", "p": "Перегородка из газобетонных блоков (п. 1.17) — 13–26.11. К этому времени уже идут перегородки ГКЛ (с 21.10), штукатурка (с 23.10) и сети ЭОМ (с 27.10); штукатурка заканчивается через 4 дня после кладки. По отчёту каменщиков 16–24.11 в среднем 5 при плане 11, 24.11 — 0.", "fix": "Кладка по графику заканчивается 26.11, перестановкой это уже не исправить. Нужно подтвердить её фактическое выполнение и готовность основания под штукатурку.", "fl": "В исправленном графике:", "tb": null}, {"c": "D8", "s": "w", "t": "Чистовые полы и изделия раньше окраски потолков", "p": "Керамогранит пола (п. 1.5) — 27.11–20.12, при том что потолки ГКЛ идут до 06.12, а окраска потолков — 21.12–14.01. Спортивное покрытие (п. 1.6) — 05–14.01 одновременно с окраской потолков, монтажом Грильято и Hook-on, фальшполом и зеркалами. Двери — 23–28.12, до окончания окраски стен (31.12) и потолков.", "fix": "Окраска потолков — 15–22.12, до фальшпола и чистовых полов. Керамогранит пола — 23.12–01.01 и 08–21.01, спортивное покрытие — 14–23.01, двери — 12–17.01, зеркала — 18–23.01.", "fl": "В исправленном графике:", "tb": null}, {"c": "D9", "s": "w", "t": "Нет испытаний и актов скрытых работ", "p": "Нет строк: гидравлические испытания водоснабжения, отопления, холодоснабжения, ВПВ и АУПТ, пролив канализации и дренажа, замеры сопротивления изоляции, акты скрытых работ перед зашивкой. Срок по тексту у конвекторов (п. 1.35) — до 30.01.2027, позже окончания графика и договорного окна инженерных систем (27.01.2027).", "fix": "Добавлены гидравлические испытания, пролив, замеры изоляции и акты скрытых работ 05–08.12, до зашивки потолков. Срок конвекторов принят по полосам.", "fl": "В исправленном графике:", "tb": null}, {"c": "D10", "s": "w", "t": "Нет кондиционирования и оборудования вентиляции", "p": "Статья сметы 1.15 «ОВ Кондиционирование» (18,5 млн ₽) в графике не представлена. Вентиляция и дымоудаление (п. 1.32, 1.33) указаны «без оборудования»: монтажа установок, фанкойлов, клапанов и автоматики нет. Дымоудаление — 2 человека на 4 дня (27–30.11) при стоимости статьи 8,4 млн ₽.", "fix": "Добавлены кондиционирование 25.11–08.12 и оборудование вентиляции и дымоудаления 09–20.12. Сроки поставки оборудования нужно подтвердить у Неолита.", "fl": "В исправленном графике:", "tb": null}, {"c": "D11", "s": "w", "t": "Ошибки в датах и численности: 22 строк из 49", "p": "В 22 строках текстовые даты расходятся с полосами больше чем на 2 дня (таблица ниже). П. 1.23: начало 23.01.2026 вместо 23.10.2026, длительность 341 день. П. 1.24: по тексту 23–30.11, по полосам 23.10–30.11. Итоговая строка численности не учитывает ячейки, введённые текстом: 01–08.11 занижено на 8 человек, 05–06.12 — на 12, 07–08.12 — на 10, 07–08.01 — на 2. Графа «Численность рабочих» не совпадает с ячейками (п. 1.24: 39 против 8; п. 1.7: 7 против 20; п. 1.5: 7 против 14). Стоимость работ не заполнена, доли затрат — #DIV/0!.", "fix": "Даты приняты по полосам, ячейки без людей убраны. Текстовые даты, итоги и стоимость должен исправить Неолит в своём файле.", "fl": "В исправленном графике:", "tb": [["1.2", "Монтаж лючков", "15.12.2026 – 28.12.2026", "17.12.2026 – 31.12.2026"], ["1.3", "Монтаж оборудования для санузлов", "19.12.2026 – 31.12.2026", "23.12.2026 – 06.01.2027"], ["1.5", "ПОЛЫ: Керамогранит Stonesystem..1200x600x9 мм.", "21.11.2026 – 14.12.2026", "27.11.2026 – 20.12.2026"], ["1.6", "ПОЛЫ: Спортивное покрытие, включая профили, плинтус 431м", "09.01.2027 – 14.01.2027", "05.01.2027 – 14.01.2027"], ["1.7", "ПОЛЫ: Фальшпол, включая люки, гидроизоляцию 920 м2", "03.12.2026 – 14.01.2027", "07.12.2026 – 14.01.2027"], ["1.8", "ПОТОЛКИ: звукоизоляционные плиты с комплектующими", "01.12.2026 – 14.01.2027", "01.12.2026 – 24.12.2026"], ["1.9", "ПОТОЛКИ: подвестные ГКЛ", "03.11.2026 – 20.12.2026", "21.11.2026 – 06.12.2026"], ["1.10", "ПОТОЛКИ: подвестные типа Грильято", "09.01.2027 – 14.01.    if(cp.in.length)h+='<p><b>Предшественники:</b></p>'+cp.in.map(l=>`<p>${cp.drv===l?'<b class="kp">держит</b>':''}${nm(l.p)}<br><small>${TY[l.t]}, ${lg(l)}. ${DATA.reas[l.why]}</small></p>`).join('');
   if(cp.out.length)h+='<p><b>Последователи:</b></p>'+cp.out.map(l=>`<p>${nm(l.s)}<br><small>${TY[l.t]}, ${lg(l)}. ${DATA.reas[l.why]}</small></p>`).join('')}
  else h+='<h4>Технологическая последовательность</h4><p>Связей с другими работами не задано.</p>'}
 return h}

function repBox(){const R=DATA.rep,n=R.d.length-1,WD=['вс','пн','вт','ср','чт','пт','сб'],el=$('repbox');
 const avg=(a,b)=>Math.round(R.tot.slice(a,b).reduce((x,y)=>x+y,0)/(b-a)),a7=avg(n-6,n+1),p7=avg(n-13,n-6),dl=R.tot[n]-R.tot[n-1];
 const c=R.cat,itr=c.id[n]+c.in[n],spc=c.sd[n]+c.sn[n],rzn=c.rd[n]+c.rn[n],sum=a=>a.reduce((x,y)=>x+y,0);
 const cumF=sum(R.tot),cumI=sum(R.itr),cumP=sum(R.plan);
 const sun=R.d.map((d,i)=>({i,wd:new Date(D(d)*864e5).getUTCDay()})).filter(o=>o.wd===0).map(o=>o.i),sl=sun[sun.length-1];
 const dlt=v=>`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${v}</span>`;
 const T=[['Всего на '+fmt(D(R.d[n])),R.tot[n]+' чел.',`${dlt(dl)} к ${fmt(D(R.d[n-1]))}`],
  ['Смены',`${R.day[n]} / ${R.night[n]}`,`день / ночь · ночная смена ${Math.round(R.night[n]/R.tot[n]*100)} %`],
  ['Категории',`${spc} / ${itr} / ${rzn}`,'специалисты / ИТР / разнорабочие'],
  ['Рабочих на одного ИТР',((R.tot[n]-itr)/itr).toFixed(1).replace('.',','),`ИТР: день ${c.id[n]}, ночь ${c.in[n]}`],
  ['Контрагенты',`${R.neo[n]} / ${R.tel[n]}`,'Неолит / ИЦ Телеком-Сервис'],
  ['Разделы отчёта',`${R.gen[n]} / ${R.vis[n]} / ${R.mis[n]}`,'общестрой / ВИС / МИС'],
  ['Среднее за 7 дней',a7+' чел.',`${dlt(a7-p7)} к предыдущим 7 дням (${p7})`],
  ['План на '+fmt(D(R.d[n])),R.plan[n]+' чел.',`факт без ИТР ${R.tot[n]-R.itr[n]} · ${dlt(R.tot[n]-R.itr[n]-R.plan[n])} к плану`],
  ['Чел.-дни с '+fmt(D(R.d[0])),sp(cumF-cumI)+' / '+sp(cumP),'факт рабочих / план по графикам'],
  ['Воскресенье '+fmt(D(R.d[sl])),R.tot[sl]+' чел.',`${Math.round(R.tot[sl]/a7*100)} % от среднего за 7 дней`]];
 const N=R.d.length,W=Math.max(el.clientWidth||0,N*34+80),H=260,L=44,Rm=22,Tp=22,B=40,pw=W-L-Rm,ph=H-Tp-B,bw=pw/N,mx=Math.ceil(Math.max(...R.tot,...R.plan)*1.1/50)*50,y=v=>Tp+ph-v/mx*ph,xx=i=>L+bw*i+bw/2;
 let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Численность по дням: день и ночь" style="display:block">`;
 for(let v=0;v<=mx;v+=50)s+=`<line class="gl" x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
 R.d.forEach((d,i)=>{const dn=D(d),wd=new Date(dn*864e5).getUTCDay(),yd=y(R.day[i]),yn=y(R.tot[i]);
  s+=`<rect x="${xx(i)-bw*0.36}" y="${yd}" width="${bw*0.72}" height="${Math.max(y(0)-yd-0.8,0.5)}" rx="2" fill="var(--fact)"/><rect x="${xx(i)-bw*0.36}" y="${yn}" width="${bw*0.72}" height="${Math.max(yd-yn-0.8,0.5)}" rx="2" fill="var(--eom)"/>`;
  s+=`<text x="${xx(i)}" y="${yn-5}" text-anchor="middle" class="t" style="font-size:11.5px;font-weight:600">${R.tot[i]}</text><text x="${xx(i)}" y="${H-B+16}" text-anchor="middle" class="t" style="font-size:12px;font-weight:600">${fmt(dn).slice(0,2)}</text><text x="${xx(i)}" y="${H-B+31}" text-anchor="middle" style="font-size:11px;${wd===0||wd===6?'fill:var(--crit)':''}">${WD[wd]}</text>`});
 s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.4" points="${R.plan.map((v,i)=>xx(i)+','+y(v)).join(' ')}"/>`;
 R.d.forEach((d,i)=>{s+=`<rect class="hit" data-i="${i}" x="${L+bw*i}" y="${Tp}" width="${bw}" height="${ph+B}" fill="transparent" style="cursor:pointer"/>`});
 s+=`<line class="ax" x1="${L}" x2="${W-Rm}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
 el.innerHTML=`<div class="rtiles">${T.map(t=>`<div class="rt"><h4>${t[0]}</h4><b>${t[1]}</b><span>${t[2]}</span></div>`).join('')}</div>`+
  `<div class="card" style="margin-bottom:10px"><div class="hrow"><h2 style="font-size:17px">Факт по дням: дневная и ночная смены, чел.</h2><button class="ib" data-info="rep" aria-label="Пояснение и легенда">i</button></div><div class="cscroll" id="repch">${s}</div></div>`;
 const tip=$('tip'),ch=$('repch');
 const show=(i,e)=>{const dn=D(R.d[i]),wd=new Date(dn*864e5).getUTCDay(),hc=c.id[i]!=null;tipAt(e,`<b>${fmy(dn)}, ${WD[wd]}</b><br>Всего: ${R.tot[i]} чел.${i?` (${R.tot[i]-R.tot[i-1]>=0?'+':''}${R.tot[i]-R.tot[i-1]} к предыдущему дню)`:''}<br>${sw('fact')}День: ${R.day[i]}<br>${sw('eom')}Ночь: ${R.night[i]}<br>${sw('accent')}План по графикам: ${R.plan[i]}`+(hc?`<br>Специалисты: ${c.sd[i]+c.sn[i]} · ИТР: ${c.id[i]+c.in[i]} · разнорабочие: ${c.rd[i]+c.rn[i]}`:`<br>ИТР: ${R.itr[i]}`)+`<br>Неолит: ${R.neo[i]} · ИЦ Телеком-Сервис: ${R.tel[i]}<br>Общестрой: ${R.gen[i]} · ВИС: ${R.vis[i]} · МИС: ${R.mis[i]}`)};
 ch.querySelectorAll('.hit').forEach(r=>{const i=+r.dataset.i;r.addEventListener('mousemove',e=>show(i,e));r.addEventListener('click',e=>{show(i,e);clearTimeout(ch._t);ch._t=setTimeout(()=>tip.hidden=true,3500)})});
 ch.querySelector('svg').addEventListener('mouseleave',()=>tip.hidden=true)}
